name: tests

# CPU-only anchor suite for the correctness primitives behind reported numbers.
# The one CUDA parity test self-skips when no GPU is available.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip check

      - name: Show versions
        run: python -c "import torch, numpy; print('torch', torch.__version__, '| numpy', numpy.__version__)"

      - name: Run anchor suite
        run: python -m pytest test/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Validate Bash orchestrator syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/run_all.sh
