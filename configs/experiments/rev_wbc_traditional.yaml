base: '../base_config.yaml'

data:
  dataset: 'wbc'
  train_dir: 'data_rev/wbc/train'
  val_dir: 'data_rev/wbc/val'
  img_size: 128
  bucket_size: 512
  classes: 3

model:
  name: 'BaselineUNetPP'
  params:
    img_size: 128
    classes: 3
    in_ch: 1
    bilinear: true
    use_se: false
    use_cbam: false
    use_aspp: false
    droppath_prob: 0

training:
  epochs: 180
  batch_size: 6
  early_stopping_patience: 180
  experiment_name: 'rev_wbc_traditional'
  learning_rate: 5e-4
  scheduler: 'CosineAnnealingLR'
  scheduler_params:
    T_max: 180
    eta_min: 1e-6
  loss:
    seg:
      name: 'CombinedSegmentationLoss'
      params:
        dice_weight: 0.5
        ce_weight: 0.5
    aux_recon:
      name: 'CombinedReconLoss'
      params:
        l1_weight: 0.3
        l2_weight: 0.3
        ssim_weight: 0.4
    seg_weight: 1.0
    aux_recon_weight: 0.0
    adaptive_loss:
      enable: false

inference:
  threshold: 0.5
