# Task-adapted recon-then-seg: an image-only U-Net++ trained from scratch on CS (ADMM-L1) reconstructions.
# Data produced by scripts/recon_dump.py --dataset carvana --method cs;
# Training hyperparameters are aligned exactly with rev_carvana_traditional.yaml / rev_carvana_fcn_m256.yaml.
base: '../base_config.yaml'

data:
  dataset: 'custom'                       # FolderSegDataset: reads <root>/<split>/{images,masks}
  train_dir: 'data_recon_m2048/cs_carvana/train'
  val_dir: 'data_recon_m2048/cs_carvana/val'
  img_size: 128
  bucket_size: 2048
  classes: 1

model:
  name: 'BaselineUNetPP'                  # input_type='image': consumes the reconstruction directly
  params:
    img_size: 128
    classes: 1
    in_ch: 1
    bilinear: true
    use_se: false
    use_cbam: false
    use_aspp: false
    droppath_prob: 0

training:
  epochs: 100
  batch_size: 16
  early_stopping_patience: 100
  experiment_name: 'ta_carvana_cs_m2048'
  learning_rate: 5e-4
  scheduler: 'CosineAnnealingLR'
  scheduler_params:
    T_max: 100
    eta_min: 1e-6
  loss:
    seg:
      name: 'CombinedSegmentationLoss'
      params:
        dice_weight: 0.5
        ce_weight: 0.5
    aux_recon:                            # train.py requires this block; BaselineUNetPP has no aux head and its weight is 0
      name: 'CombinedReconLoss'
      params:
        l1_weight: 0.3
        l2_weight: 0.3
        ssim_weight: 0.4
    seg_weight: 1.0
    aux_recon_weight: 0.0
    adaptive_loss:
      enable: false

inference:
  threshold: 0.5
