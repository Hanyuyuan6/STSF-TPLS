# Task-adapted recon-then-seg: an image-only U-Net++ trained from scratch on HSI (tradgi) reconstructions (MNIST, binary).
# Data produced by scripts/recon_dump.py --dataset mnist --method hsi;
# Note: after the dump the data already follows the standard images/masks layout, so it is read with 'custom' (FolderSegDataset)
# (the original 'mnist' dataset class is the torchvision generated one and never reads a directory).
# Training hyperparameters are aligned exactly with rev_mnist_traditional.yaml.
base: '../base_config.yaml'

data:
  require_reconstruction_manifest: true  # fail closed if the reconstruction inventory is missing/tampered
  dataset: 'custom'
  train_dir: 'data_recon_m64/hsi_mnist/train'
  val_dir: 'data_recon_m64/hsi_mnist/val'
  img_size: 128
  bucket_size: 64
  classes: 1

model:
  name: 'BaselineUNetPP'
  params:
    img_size: 128
    classes: 1
    in_ch: 1
    bilinear: true
    use_se: false
    use_cbam: false
    use_aspp: false
    droppath_prob: 0

training:
  epochs: 60
  batch_size: 32
  early_stopping_patience: 60
  experiment_name: 'ta_mnist_hsi_m64'
  learning_rate: 5e-4
  scheduler: 'CosineAnnealingLR'
  scheduler_params:
    T_max: 60
    eta_min: 1e-6
  loss:
    seg:
      name: 'CombinedSegmentationLoss'
      params:
        dice_weight: 0.5
        ce_weight: 0.5
    aux_recon:
      name: 'CombinedReconLoss'
      params:
        l1_weight: 0.3
        l2_weight: 0.3
        ssim_weight: 0.4
    seg_weight: 1.0
    aux_recon_weight: 0.0
    adaptive_loss:
      enable: false

inference:
  threshold: 0.5
